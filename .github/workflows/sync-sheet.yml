name: Backlog en versies naar Google Sheet

on:
  push:
    branches: [main]
    paths:
      - 'docs/BACKLOG.md'
      - 'docs/VERSIES.md'
      - 'tools/sync_sheet.py'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install google-api-python-client google-auth
      - run: python tools/sync_sheet.py
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
